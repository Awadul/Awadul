<title id="title">Awais Abdullah — Full-stack developer</title>
<desc id="desc">NUST CS 2027. Open to internships and freelance work. AI CV Platform: resume parsing and scoring. NUST Student Guide: policy retrieval. DiscordQuestManager: proposed compatibility fixes. Stack: TypeScript, React, Next.js, Node.js, Python, PostgreSQL.</desc>
